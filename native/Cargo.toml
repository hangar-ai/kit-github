[package]
name = "kit-github-tab"
description = "The two tabs of the GitHub kit (pull requests, issues): Rust, built to WebAssembly"
version = "0.1.0"
edition = "2024"
publish = false

# One crate and one module for both tabs: `init` reads `start.tab.id`. A cdylib
# is the module Hangar loads; the rlib is for `cargo test`, which runs the tabs
# on the host with hangar_kit_sdk::testing.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hangar-kit-sdk = { git = "https://github.com/hangar-ai/hangar", branch = "feat/native-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
